const toolBox= {
  small: [ -1, 0, 1],

  world: {

hitCrate(){
  let hit = toolBox.combat.punch();

  // subtract damage first
  gameData.enemyArr[0].maxHP -= hit;

  // if crate still alive
  if (gameData.enemyArr[0].maxHP > 0){
    toolBox.updateTool.storyAppend(
      `You hit the box for ${hit} damage <br> Crate HP: ${gameData.enemyArr[0].maxHP}<br>`
    );
    return;
  }

  // crate breaks
  toolBox.updateTool.storyAppend(
    `You break the crate and find something inside as well as gained xp!`
  );

  toolBox.playerTool.gainXP(5);
  toolBox.lootTool.findRandomItem();
  toolBox.updateTool.updateSceneImage("images/AlleyEmpty.png");

  // remove hit button
  const hitBtn = document.getElementById("fightCrate");
  if (hitBtn) hitBtn.remove();
  const alleyBack = document.createElement("button");
  alleyBack.id = "alleyBack";
  alleyBack.innerText = "Return to Village";
  modeOutput.appendChild(alleyBack);
  alleyBack.addEventListener('click', () => {
    changeMode("Village");
  })
  locationTitle.innerText = "Currently: Empty Alley";
  gameState.world.crateBroken = true;
},

hitRat(){
  
  if (gameState.world.ratFought || !gameState.currentEnemy || gameState.currentEnemy.currentHP <= 0) {
    return;
  }

  let hit = toolBox.combat.punch();
  let dmg = gameState.currentEnemy.attack;
  gameState.currentEnemy.currentHP -= hit;

  if (gameState.currentEnemy.currentHP > 0){
    toolBox.updateTool.storyAppend(
      `You hit the rat for ${hit} damage <br> Rat HP: ${gameState.currentEnemy.currentHP}<br>`
    );
    gameState.player.health -= dmg;
    toolBox.updateTool.storyAppend(
      `The rat attacks you for ${dmg} damage <br>`
    );
    toolBox.updateTool.playerStatUpdate();

    return;
  }
  if (gameState.currentEnemy.currentHP <= 0){
    gameState.currentEnemy.currentHP = 0;
    toolBox.updateTool.storyNew(
      `You defeated the rat and gained xp!`
    );

  toolBox.playerTool.gainXP(gameState.currentEnemy.xpReward);
  toolBox.playerTool.gainGold(gameState.currentEnemy.goldReward);
  let reward = toolBox.lootTool.getDrop(gameState.currentEnemy);
  toolBox.inventoryTool.addToInventory(reward.name, 1, reward.number);
  gameState.world.ratFought = true;
toolBox.updateTool.updateSceneImage("./images/DefeatedRat.png");
  setTimeout(() => {
    changeMode("Field");
  }, 4500);}

}



  },

  minigameTool: {

    spinWheel (){

      if (gameState.world.wheelSpinable === true){
      

      const segements = gameData.rpgWheel.segments;

      let index = toolBox.randomTool.chooseRandom(segements);
      let result = segements[index];

      let slice = 360 / segements.length;

      let finalAngle = (360 * 5) + (slice * index) + 18;

      gameState.wheelSpinAngle = finalAngle;
      
      gameState.wheelSpinResult = result;

      return result;
      }

      else
      {return}

    },

    resetWheel(){

      gameState.wheelSpinAngle = 0;
      
      gameState.wheelSpinResult = 0;

    }



  },

  randomTool: {

    rollNumber(number){
      return Math.floor(Math.random() * number);
    },

    chooseRandom(array){
      return Math.floor(Math.random() * array.length);
    },

    randomItem(){
      let pickedItem = gameData.itemList[toolBox.randomTool.chooseRandom()]; // remember to call toolBox first. then the sub"folder"
      return pickedItem; //this will be an object as far as i can tell.
    }
  },

  status: {

   PoisonedState(){
    // 
    let isPosioned = true;
    let posionCounter = 3

    // 
    function poisonDmg () {
      posionCounter--;
      if(isPosioned === true){
        takeDamage(10);
      }
      if (posionCounter <= 0){
        curePoisoning();
      }
      if (isPosioned === true){
        player.poisonCheck = true;
      }
    };
    //     
    function curePoisoning(){
        isPosioned = false;    
        player.poisonCheck = false;
      }

    return {poisonDmg, curePoisoning}

   },
  },

  playerTool: {

  levelUp(){
    gameState.player.xp -= gameState.player.maxXP;
    gameState.player.level++;
    gameState.player.maxXP = Math.floor(gameState.player.maxXP * 1.75);
    toolBox.updateTool.playerStatUpdate();
    toolBox.updateTool.storyAppend(`You Leveled Up!<br> You are now level ${gameState.player.level}.<br>`);
  },

  gainXP(amount){
    gameState.player.xp += amount;
    toolBox.updateTool.playerStatUpdate();
    while(gameState.player.xp >= gameState.player.maxXP){
      toolBox.playerTool.levelUp();
    }
  },


  gainGold(amount){
    gameState.player.gold += amount;
    toolBox.updateTool.playerStatUpdate();
  },
},

inventoryTool: {

  useItem(name){
    let result = toolBox.inventoryTool.findItem(name);
    if (result === null) {
      toolBox.updateTool.storyAppend("item not found");
      return;
    }
    else {
      result.item.quantity--;
      toolBox.updateTool.storyAppend(`Used one: ${result.item.name}<br>`);
      if (result.item.quantity === 0) {
        let index = result.index;
        gameState.player.inventory.splice(index, 1);
    }
  }
  toolBox.updateTool.playerInventoryUpdate();
  },

  findItem(name) {
    for (let i = 0; i < gameState.player.inventory.length; i++) {
      let item = gameState.player.inventory[i];
      if (item.name === name) {
        return {
           item: item,
          index: i
        };
      }
    }
    return null;
  },

  addToInventory(item, amount, itemNumber){
    let found = false;

  for (const items of gameState.player.inventory){
    console.log("Checking:", items.name, items.item);
    if (items.name === item){
      items.quantity = items.quantity + amount;
      found = true;
      break;
    }
  }
  
  if (found === false){
    let specificItem = gameData.itemList[itemNumber];
    let clone = {...specificItem, quantity: amount};
    gameState.player.inventory.push(clone);
  }

    toolBox.updateTool.playerInventoryUpdate();
  }
}, 

  
  enemyTool: {

    createInstance(template){
      let clone = {...template};
      clone.drops = Array.isArray(template.drops)
        ? template.drops.map(drop => ({ ...drop }))
        : [];
      clone.currentHP = clone.maxHP;
      clone.status = {poisoned: false};
      clone.turnCounter = 0;
      return clone;    
    },


  },

  updateTool: {


updateSceneImage(path) {
  const img = document.getElementById("sceneImage");
  img.src = path;
},

updateSceneImageTwo(path){
const img = document.getElementById("sceneImageTwo");
img.src = path;
},

playerStatUpdate(){
  playerOutput.innerHTML = `
    Name: ${gameState.player.name}<br>
    Level: ${gameState.player.level}<br>
    Weapon: ${gameState.player.weapon}<br>
    Armor: ${gameState.player.armor}<br>
    XP: ${gameState.player.xp}/${gameState.player.maxXP}<br>
    Health: ${gameState.player.health}<br>
    Gold: ${gameState.player.gold}g
  `;
},


    playerInventoryUpdate(){
      let inventoryEntries = ''
      gameState.player.inventory.forEach(item => {
      inventoryEntries += `<br>${item.name} — Quantity: ${item.quantity} <button onclick="toolBox.inventoryTool.useItem('${item.name}')">Use</button><br>`
      })      
    inventoryOutput.innerHTML = inventoryEntries
    if (gameState.player.inventory.length === 0) {
      inventoryOutput.innerHTML = "Inventory is empty.";
    }},

    storyAppend(message){
      storyBox.innerHTML += message;
    },

    storyNew(message){
      storyBox.innerHTML = message;
    },
  },

  abilityTool: {


    learnAbility(spam){
      for (const move of gameData.potentialAbilities){
      if (spam === move.ability){
        let clone = {...move};
        gameState.player.abilities.push(clone);
        toolBox.updateTool.storyAppend(`You learned: $(clone.ability)<br>`);
        return;
      }
    }
    console.log('error');
    }






  },

  combat: {


    combatRouter(action, payload){
      switch(action){
        case "attack":
          toolBox.combatTool.attack(payload);
          break;
        case "defend":
          toolBox.combatTool.defend();
          break;
        case "useItemInCombat":
          toolBox.combatTool.useItemInCombat(payload);
          break;
        case "flee":
          toolBox.combatTool.fleeAttempt();
          break;
        default:
          console.log("Unknown action:", action);
      }
    },

    useItemInCombat(itemName){
      toolBox.inventoryTool.useItem(itemName);
    },

    damageRoller(baseDamage, size){
      let amount = baseDamage;

      if (size === "small"){
        let varSmall = toolBox.small[toolBox.randomTool.chooseRandom(toolBox.small)];
        amount = amount + varSmall;
      }
      if (size === "medium"){
        let varMedium = toolBox.medium[toolBox.randomTool.chooseRandom(toolBox.medium)];
        amount = amount + varMedium;
      }
      if (size === "large"){
        let varLarge = toolBox.large[toolBox.randomTool.chooseRandom(toolBox.large)];
        amount = amount + varLarge;
      }
      return amount;     


    },

    punch(){
      return toolBox.combat.damageRoller(5, "small");
    }

  },

  lootTool: {

  findRandomItem (){
      let randomItem = gameData.itemList[Math.floor(Math.random() * gameData.itemList.length)];
      let clone = {...randomItem, quantity: 1};
      gameState.player.inventory.push(clone);
    toolBox.updateTool.playerInventoryUpdate();  
    },



    
getDrop(enemy) {

  let roll = Math.floor(Math.random() * 10);

  for (let drop of enemy.drops) {
    roll -= drop.chance;
    if (roll < 0) {
      return drop;
    }
  }
}



  },
}

function wheelMode() {

  gameState.mode = "Wheel";
  gameState.world.wheelSpinable = true;


  if(gameState.mode === "Wheel"){
    toolBox.updateTool.updateSceneImage("images/Empty.png");
    const wheelWrapper = document.createElement('div');
    wheelWrapper.id = "wheelWrap";
    const wheelImg = document.createElement('img');
    wheelImg.id = "wheelImage";
    wheelImg.src = "images/Wheel.png";
    const pointerImg = document.createElement('img');
    pointerImg.id = "wheelPointer";
    pointerImg.src = "images/Pointer.png"
    document.querySelector('#story-wrapper').appendChild(wheelWrapper);
    wheelWrapper.appendChild(wheelImg);
    wheelWrapper.appendChild(pointerImg);
 
  // clear interactive zone (for now)
  toolBox.updateTool.storyNew("Click the wheel to spin.");

  // make the wheel clickable
  const wheel = document.getElementById('wheelImage');
  wheel.addEventListener('click', () => {
    if (!gameState.world.wheelSpinable) return;

    toolBox.minigameTool.spinWheel();

    let currentAngle = 0;
    if (wheelImg.dataset.angle) {
      currentAngle = Number(wheelImg.dataset.angle);
    }

    let totalRotation = currentAngle + gameState.wheelSpinAngle;
    wheelImg.dataset.angle = totalRotation;
    wheelImg.style.transform = 'rotate(' + totalRotation + 'deg)';

    setTimeout(function () {
      gameState.world.wheelSpinable = true;
    }, 5000);
  });

  modeOutput.innerHTML = `
  <button id="exitWheel">Return</button>
  `;
  const exitWheel = document.querySelector('#exitWheel');
  exitWheel.addEventListener('click', () => {
    clearUI();
    wheelImg.remove();
    pointerImg.remove();
    gameState.world.wheelSpinable = false;
    shopMode();
  })
}
}

      toolBox.updateTool.storyNew(`A rat has scurried up to you and it seems aggresive. ready to fight?`);
      modeOutput.innerHTML = `
      <button id="fightRat">Fight</button>
      <button id="runRat">Run</button>
      `;
      const runRat = $('#runRat');
      const fightRat = $('#fightRat');
      runRat.addEventListener('click', () => {
        changeMode("Field");
      })
      fightRat.addEventListener('click', () => {
        toolBox.updateTool.storyNew(`You prepare to fight the rat!`);
        toolBox.updateTool.storyAppend(`<br>Rat HP: ${gameData.enemyArr[1].maxHP}<br>`);
        gameState.currentEnemy = toolBox.enemyTool.createInstance(gameData.enemyArr[1]);
        modeOutput.innerHTML = `
        <button id="attackRat">Attack</button>
        <button id="runRat">Run</button>
        `;
        const attackRat = $('#attackRat');
        const runRat = $('#runRat');
        attackRat.addEventListener('click', () => {
          toolBox.world.hitRat();
        })
        runRat.addEventListener('click', () => {
          changeMode("Field");
        })
      })
      
      
    };
 
    function forestMode(){
      toolBox.updateTool.updateSceneImage("images/forest.jpg");
      toolBox.updateTool.storyNew(`You walk into the forest and notice an apple tree nearby.<br>`)
      locationTitle.innerText = "Currently: Forest";
      modeOutput.innerHTML = `
      <button id="returnExplore">Return</button>
      <button id="shakeTree">Shake Tree</button>
      `;
      const returnExplore = $('#returnExplore');
      returnExplore.addEventListener('click', () => {
        changeMode("Explore");
      })
      const shakeTree = $('#shakeTree');
     
      shakeTree.addEventListener('click', () => {
         if (gameState.world.treeShaken === false) {
        toolBox.updateTool.storyAppend(`You shake the tree and 3 apples fall from it.<br> You pick them up.<br>`)
        toolBox.inventoryTool.addToInventory("Apple", 3, 10);
        gameState.world.treeShaken = true;
      }

        else {
          toolBox.updateTool.storyAppend(`you find shaking the tree does nothing for now...`)
        }
      })
    }

  

    function villageMode(){
      toolBox.updateTool.updateSceneImage("./images/Village.jpg");
      storyBox.innerHTML = 'You stand in the townsquare...';
      locationTitle.innerText = 'Currently: Village';
      modeOutput.innerHTML = `
      <button id="villToHome">Go Home</button>
      <button id="villToAlley">Explore Alley</button>
      <button id="villToShop">Shop</button>
      <button id="villToExplore">Explore Outside of Town</button>
      ` 
      const villToAlley = $('#villToAlley');
      const villToShop = $('#villToShop');
      const villToHome = $('#villToHome');
      const villToExplore = $('#villToExplore');

      villToShop.addEventListener('click', () => {
        changeMode('Shop');
      })

      villToAlley.addEventListener('click', () => {
        changeMode("Alley");
      })

      villToHome.addEventListener('click', () => {
        changeMode("Home");
      });

      villToExplore.addEventListener('click', () => {
        changeMode("Explore")
      });

    }

    function alleyMode(){
      if (gameState.world.crateBroken) {
    toolBox.updateTool.updateSceneImage("images/AlleyEmpty.png");
    toolBox.updateTool.storyNew("The crate is gone.");
    modeOutput.innerHTML = `
        <button id="alley-back">Return to Village</button>
    `
    const alleyBack = $('#alley-back');
    alleyBack.addEventListener('click', () => {
      changeMode("Village");
    })
    ;
    return;
}

      toolBox.updateTool.updateSceneImage("images/Alley.png");

  // YOU write this part
  toolBox.updateTool.storyNew(`You walk into the nearest alley. You Find a Crate.<br>`);

  modeOutput.innerHTML = `
    <button id="alley-back">Return to Village</button>
    <button id="alley-move">Approach the crate</button>
  `;
  const closerCrate = $('#alley-move');
  const alleyBack = document.getElementById("alley-back");
  alleyBack.addEventListener('click', () => {
    changeMode("Village");
  });

  closerCrate.addEventListener('click', () => {
    toolBox.updateTool.updateSceneImage("images/AlleyCloser.png")
    alleyBack.remove();
    modeOutput.innerHTML = `
    <button id=fightCrate>Hit Crate</button>
    `
    const hitCrate = $('#fightCrate');
    gameData.enemyArr[0].maxHP = gameData.enemyArr[0].maxHP;
    hitCrate.addEventListener('click', () => {
      toolBox.world.hitCrate();
    })

  });

      
    }

   function changeMode(mode) {
  gameState.mode = mode;
  clearUI();
  toolBox.updateTool.playerStatUpdate();

  if (mode === "Home") homeMode();
  if (mode === "Explore") exploreMode();
  if (mode === "Scavenge") scavengeMode();
  if (mode === "Combat") combatMode();
  if (mode === "Village") villageMode();
  if (mode === "Alley") alleyMode();
  if (mode === "Shop") shopMode();
  if (mode === "Forest") forestMode();
  if (mode === "Field") fieldMode();
  if (mode === "Alert") alertMode();
  if (mode === "Wheel") wheelMode();
}

function clearUI(){
  storyBox.innerText = '';
}

changeMode("Shop");

</script>
